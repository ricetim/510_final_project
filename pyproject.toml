[project]
name = "moral-variant-runner"
version = "0.1.0"
description = "Run moral-variant CSV prompts through the Anthropic Claude API."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.70.0",
    "openai>=1.50.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
